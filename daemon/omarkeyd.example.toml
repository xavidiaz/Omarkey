# Copy to ~/.config/omarkey/omarkeyd.toml and edit.

# --- One database -----------------------------------------------------------
# Absolute path (or ~/…) to your KeePass database.
vault = "~/secrets.kdbx"
# Optional key file that pairs with the master password.
# keyfile = "~/.config/omarkey/secrets.keyx"

# --- Several databases ----------------------------------------------------
# Instead of the `vault`/`keyfile` lines above, list one [[vault]] table per
# database. One is unlocked at a time; `omarkey use <name>` / `omarkey unlock
# <name>` switch between them. The first entry is active at startup. `name`
# defaults to the file stem if omitted.
#
#   [[vault]]
#   name = "personal"
#   path = "~/personal.kdbx"
#
#   [[vault]]
#   name = "work"
#   path = "~/work.kdbx"
#   keyfile = "~/work.keyx"

# --- Options (apply to all databases) -------------------------------------
# Lock the active vault after this many seconds with no requests. 0 disables it.
idle_lock_seconds = 300

# How long a copied secret stays on the clipboard before omarkeyd wipes it.
clipboard_clear_seconds = 20

# Allow `unlock` with a password sent over the socket. Off by default: normally
# omarkeyd runs its own pinentry so the master password never crosses the socket.
allow_inline_unlock = false

# pinentry program. Omit to autodetect `pinentry` on PATH.
# pinentry_program = "pinentry-gnome3"

# Override the socket location. Defaults to $XDG_RUNTIME_DIR/omarkey.sock.
# socket_path = "/run/user/1000/omarkey.sock"
